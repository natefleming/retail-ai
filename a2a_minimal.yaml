# yaml-language-server: $schema=../../../schemas/model_config_schema.json
#
# Minimal dao-ai agent that demonstrates the Google A2A (Agent2Agent) protocol
# endpoints mounted automatically on every Databricks Apps deployment.
#
# When deployed (``dao-ai pipeline -c ... --deploy --deployment-target apps``),
# the app exposes:
#   - GET  /.well-known/agent-card.json   (A2A Agent Card)
#   - POST /a2a                           (A2A JSON-RPC 2.0)
#   - POST /invocations                   (MLflow Responses / chat-completions)
#
# No Unity Catalog tables, Vector Search indexes, or Genie rooms required —
# only Foundation Model API access (default on every Databricks workspace).

resources:
  models:
    default_llm: &default_llm
      name: databricks-gpt-5-4-mini

agents:
  greeter: &greeter
    name: greeter
    description: A friendly assistant that answers general questions.
    model: *default_llm
    prompt: |
      You are a friendly, concise assistant. Answer the user's question in
      one or two sentences. Be helpful and direct.

app:
  name: a2a-minimal
  description: Minimal dao-ai agent demonstrating Google A2A protocol support.
  log_level: INFO
  deployment_target: apps
  agents:
  - *greeter
  # A2A is enabled by default on Databricks Apps deployments. The block below
  # is purely illustrative — every field has a sensible default. Set
  # ``a2a.enabled: false`` to opt out entirely. The default ``task_store`` is
  # an empty A2ATaskStoreModel (no ``database`` → InMemoryTaskStore), which is
  # fine for this demo. To persist tasks in Lakebase, set
  # ``task_store.database`` to a DatabaseModel (see a2a_long_running.yaml).
  a2a:
    enabled: true
