resources:
  experiments:
    a2a-minimal-experiment:
      name: /Users/${workspace.current_user.userName}/a2a-minimal
  apps:
    a2a-minimal:
      name: a2a-minimal
      description: Minimal dao-ai agent demonstrating Google A2A protocol support.
      source_code_path: ${workspace.file_path}
      config:
        command:
        - uv
        - run
        - python
        - -m
        - dao_ai.apps.start_app
        env:
        - name: MLFLOW_TRACKING_URI
          value: databricks
        - name: MLFLOW_REGISTRY_URI
          value: databricks-uc
        - name: MLFLOW_EXPERIMENT_ID
          value_from: experiment
        - name: DAO_AI_CONFIG_PATH
          value: a2a_minimal.yaml
        - name: API_PROXY
          value: http://localhost:8000/invocations
        - name: CHAT_APP_PORT
          value: '3000'
        - name: CHAT_PROXY_TIMEOUT_SECONDS
          value: '300'
      resources:
      - name: experiment
        experiment:
          experiment_id: ${resources.experiments.a2a-minimal-experiment.id}
          permission: CAN_EDIT
      - name: default_llm
        serving_endpoint:
          name: databricks-gpt-5-4-mini
          permission: CAN_QUERY
