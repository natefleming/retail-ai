name: Publish docs 📚 to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages via the Pages deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Just the Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - name: Stage docs (inject front matter, keep sources pristine)
        run: |
          python -m pip install --quiet pyyaml
          python scripts/build-docs-site.py --staging _site_src
      - name: Build with Jekyll
        run: |
          bundle exec jekyll build \
            --source _site_src \
            --destination _site \
            --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
