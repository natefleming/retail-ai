[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dao-ai"
version = "0.2.7"
description = "DAO AI: A modular, multi-agent orchestration framework for complex AI workflows. Supports agent handoff, tool integration, and dynamic configuration via YAML."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Nate Fleming", email = "nate.fleming@databricks.com" },
    { name = "Nate Fleming", email = "nate.fleming@gmail.com" },
]
maintainers = [
    { name = "Nate Fleming", email = "nate.fleming@databricks.com" },
]
keywords = [
    "ai",
    "agents", 
    "multi-agent",
    "orchestration",
    "langgraph",
    "langchain",
    "databricks",
    "llm",
    "vector-search",
    "workflow"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    # Shell tab-completion for the ``dao-ai`` CLI (argparse + argcomplete).
    # Zero runtime deps and ~240 KB, so it's a core dep — completion just works
    # once enabled in the shell (see docs/cli-reference.md). The autocomplete()
    # hook in cli.py is still guarded, so a stripped env without it is harmless.
    "argcomplete>=3.0.0",
    "databricks-agents>=1.11.0",
    "databricks-langchain[memory]>=0.20.0",
    "databricks-mcp>=0.9.0",
    "databricks-sdk[openai]>=0.108.0",
    # Core (not an optional extra) because dao-ai source imports
    # databricks.ai_search.{client,index,reranker} unconditionally (config,
    # tools, providers, provisioning). This is the successor to the
    # deprecated databricks-vectorsearch package; databricks-langchain and
    # friends already depend on it, and it re-exports the VectorSearchClient/
    # VectorSearchIndex names as back-compat aliases of AISearchClient/Index.
    "databricks-ai-search>=0.75",
    "langchain>=1.2.12",
    "langchain-community>=0.4.1",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph-checkpoint-postgres==3.0.5",
    "langgraph>=1.1.10",
    "loguru>=0.7.3",
    "mcp>=1.26.0",
    "mlflow[databricks]>=3.10.1",
    "nest-asyncio>=1.6.0",
    "psycopg[binary,pool]>=3.3.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.2",
    "rfc8785>=0.1.4",
    "ruamel.yaml>=0.18,<0.19",
    "sqlparse>=0.5.4",
    "unitycatalog-ai[databricks]>=0.3.2",
]

[project.scripts]
dao-ai = "dao_ai.cli:main"

[project.urls]
Homepage = "https://github.com/natefleming/dao-ai"
Documentation = "https://natefleming.github.io/dao-ai"
Repository = "https://github.com/natefleming/dao-ai"
Issues = "https://github.com/natefleming/dao-ai/issues"
Changelog = "https://github.com/natefleming/dao-ai/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-rerunfailures>=15.0",
    "pytest-xdist>=3.6.1",
]
databricks = [
    # databricks-connect bundles its own protobuf-5-compatible pyspark; a
    # standalone pyspark>=3.5.0 resolves to 4.x, whose spark-connect gencode
    # needs protobuf>=6.33 and collides with databricks-ai-search's protobuf<6
    # cap (breaks local `dao-ai deploy --target model_serving`). See issue #211.
    "databricks-connect>=16.0.0",
]
mcp = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
# ---------------------------------------------------------------------------
# Optional runtime feature extras. Each gates a heavyweight dependency tree
# behind a feature that most deployments don't use, keeping `pip install
# dao-ai` lean. The extras resolver (dao_ai._extras) auto-selects these into
# generated requirements/pip_requirements based on what a config exercises.
# Missing an extra at runtime raises a friendly "install dao-ai[<extra>]" error.
# ---------------------------------------------------------------------------
a2a = [
    "a2a-sdk>=0.3.0,<1.0.0",
]
rerank = [
    "flashrank>=0.2.10",
]
deepagents = [
    "deepagents>=0.5.7",
]
memory = [
    "langmem>=0.0.30",
]
search = [
    "ddgs>=9.10.0",
]
excel = [
    "openpyxl>=3.1.5",
]
# Convenience bundle of every runtime feature extra (self-referential — a
# PyPA-supported pattern). Distinct from the PEP 735 [dependency-groups].all
# below, which bundles the dev/docs/test *tooling* groups. `dao-ai[all]`
# installs runtime features; `--group all` installs dev tooling.
all = [
    "dao-ai[a2a,rerank,deepagents,memory,search,excel]",
]
[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest-timeout>=2.4.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1", 
    "mkdocstrings[python]>=1.0.0",
]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-rerunfailures>=15.0",
    "pytest-xdist>=3.6.1",
]
databricks = [
    # databricks-connect bundles its own protobuf-5-compatible pyspark; a
    # standalone pyspark>=3.5.0 resolves to 4.x, whose spark-connect gencode
    # needs protobuf>=6.33 and collides with databricks-ai-search's protobuf<6
    # cap (breaks local `dao-ai deploy --target model_serving`). See issue #211.
    "databricks-connect>=16.0.0",
]
mcp = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]
# Runtime feature groups mirror [project.optional-dependencies] so `uv sync
# --group <name>` works. PEP 735 groups cannot self-reference `dao-ai[...]`,
# so the runtime bundle is expressed with include-group directives.
a2a = [
    "a2a-sdk>=0.3.0,<1.0.0",
]
rerank = [
    "flashrank>=0.2.10",
]
deepagents = [
    "deepagents>=0.5.7",
]
memory = [
    "langmem>=0.0.30",
]
search = [
    "ddgs>=9.10.0",
]
excel = [
    "openpyxl>=3.1.5",
]
# Dev-tooling bundle (NOT the runtime features — see [project.optional-
# dependencies].all for `dao-ai[all]`).
all = [
    { include-group = "dev" },
    { include-group = "docs" },
    { include-group = "test" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/dao_ai"]
sources = ["src"]
# Excludes are root-anchored (leading "/") so they only drop the repo-root
# demo/tooling dirs and NOT the packaged pipeline assets under
# src/dao_ai/pipeline/ (notably src/dao_ai/pipeline/notebooks/, which an
# unanchored "notebooks" pattern would wrongly strip from the wheel).
exclude = [
    "/docs",
    "/examples",
    "/notebooks",
    "/schemas",
    "/config",
    "/databricks.yaml",
    "/tests",
    "/uv.lock",
    "/Makefile",
]

[tool.hatch.build.targets.sdist]
# For source distribution, include more files that developers might need
exclude = [
    ".databricks",
    ".vscode", 
    ".pytest_cache",
    ".ruff_cache",
    ".env",
    "uv.lock",
]

[tool.pytest.ini_options]
# Pytest configuration
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 120  # Per-test timeout (seconds) — prevents gRPC/Spark hangs from blocking the suite
addopts = [
    "-v",                          # Verbose output
    "--strict-markers",            # Enforce marker registration
    "--tb=short",                  # Shorter traceback format
    "--disable-warnings",          # Disable warnings in output
    # Uncomment to enable parallel execution by default:
    # "-n", "auto",                # Run tests in parallel using all available CPUs
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "slow: Slow tests that take more than a few seconds",
    "flaky: Tests that may fail intermittently",
]

[tool.ruff]
# Enable the Ruff formatter
target-version = "py311"  # Minimum supported Python version
line-length = 88  # Same as Black's default
indent-width = 4

# Add the formatter section
[tool.ruff.format]
quote-style = "double"  # Black uses double quotes
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Set directories to include/exclude
[tool.ruff.lint]
select = ["E", "F", "I"]  # You can add more linting rules here
ignore = []
fixable = ["ALL"]
unfixable = []

# Exclude files/directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Databricks notebooks (`# Databricks notebook source`) legitimately break two
# lint rules: imports live inside `# COMMAND ----------` cells rather than at the
# top of the module (E402), and the runtime injects globals like `spark`,
# `dbutils`, `dlt`, and `display` that are undefined to a static checker (F821).
# Scope the ignores to the notebooks dir so the rest of the tree stays strict.
[tool.ruff.lint.per-file-ignores]
"src/dao_ai/pipeline/notebooks/*.py" = ["E402", "F821"]
