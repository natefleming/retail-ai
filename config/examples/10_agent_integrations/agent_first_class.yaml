# yaml-language-server: $schema=../../../schemas/model_config_schema.json

# ==============================================================================
# First-class `type: agent` example
# ==============================================================================
# Demonstrates the first-class `type: agent` tool shape — a typed Pydantic
# wrapper over `create_agent_endpoint_tool` that lets an agent call a deployed
# Model Serving endpoint (Knowledge Assistant, ChatCompletions, or ChatAgent)
# as a tool. Covers the Supervisor API `knowledge_assistant` and
# `serving_endpoint` tool types with one shape.
#
# For Databricks Apps:
#   - MCP apps   → use `type: mcp` with `app:`
#   - A2A apps   → use `type: a2a` with `app:`  (see a2a_first_class.yaml)
#
# Equivalent to:
#
#   function:
#     type: factory
#     name: dao_ai.tools.create_agent_endpoint_tool
#     args:
#       llm:
#         name: <endpoint-name>
#       name: <tool-name>
#       description: <prompt>
#
# but with IDE autocomplete and JSON-schema validation.
# ==============================================================================

resources:
  models:
    main_llm: &main_llm
      name: databricks-claude-sonnet-4
      temperature: 0.1

tools:
  # Knowledge Assistant: a KA deploys as a Model Serving endpoint with a known
  # prefix (e.g. `ka-customer-reviews`). Reference it directly by endpoint name.
  customer_reviews_ka: &customer_reviews_ka
    name: customer_reviews
    function:
      type: agent
      endpoint: ka-customer-reviews
      description: |
        Answer questions about recent customer reviews. Pass the user's
        question through; the KA cites sources in its answer.

  # Generic ChatAgent serving endpoint. Set `on_behalf_of_user: true` to
  # forward the calling user's bearer token so downstream resource grants
  # resolve as that user.
  triage_specialist: &triage_specialist
    name: triage_specialist
    function:
      type: agent
      endpoint: my-triage-agent
      on_behalf_of_user: true
      description: |
        Delegate ticket-triage questions to the specialized triage agent.
        Returns a structured triage result as a single string.

agents:
  orchestrator: &orchestrator
    name: orchestrator
    model: *main_llm
    tools:
    - *customer_reviews_ka
    - *triage_specialist
    prompt: |
      You are an orchestrator. Use `customer_reviews` for any question
      about customer feedback. Use `triage_specialist` for any question
      about ticket prioritization. Relay each agent's answer back to the
      user; do not paraphrase unless asked.

app:
  name: agent_first_class_dao
  description: >
    Minimal example of the first-class `type: agent` tool shape calling
    a Knowledge Assistant and a generic Model Serving endpoint.
  log_level: INFO
  deployment_target: apps
  agents:
  - *orchestrator

  input_example:
    messages:
    - role: user
      content: "What do customers say about return policy?"
