# yaml-language-server: $schema=../../../schemas/model_config_schema.json

# ==============================================================================
# GCP Vertex AI Agent Engine Integration
# ==============================================================================
# Two-agent system combining a Databricks Genie agent (sales & pricing analytics
# for a sporting goods retailer) with a Google Cloud ADK agent exposed via the
# Vertex AI Reasoning Engine ``:streamQuery`` endpoint.
#
# A supervisor routes each turn to either the Genie analytics specialist or the
# GCP customer service agent based on the nature of the request.
# ==============================================================================

schemas:
  sporting_goods_schema: &sporting_goods_schema
    catalog_name: retail_consumer_goods
    schema_name: sporting_goods_store

resources:
  llms:
    default_llm: &default_llm
      name: databricks-claude-sonnet-4
      temperature: 0.1
      max_tokens: 4096

  genie_rooms:
    sales_pricing_genie_room: &sales_pricing_genie_room
      name: "Sales and Pricing Analytics - Sporting Goods"
      description: >
        Genie room for sales performance analysis, pricing strategy, margin
        analytics, promotional effectiveness, and revenue tracking across
        stores and channels.
      space_id:
        env: SALES_PRICING_GENIE_SPACE_ID
        default_value: 01f138eb565714dfb9d31a05f9ee9270

variables:
  # GCP service-account credentials. Three equally valid forms:
  #
  #   1. Local file path (GCP's ADC convention):
  #        gcp_credentials: { env: GOOGLE_APPLICATION_CREDENTIALS }
  #
  #   2. Databricks Volume path (FUSE mount in-runtime, Files API outside):
  #        gcp_credentials: "/Volumes/main/gcp/keys/sandbox-field-eng.json"
  #
  #   3. Inline JSON body from a secret scope:
  #        gcp_credentials:
  #          scope: gcp
  #          secret: sandbox_field_eng_sa_json
  #
  # The loader inspects the resolved string and picks the right path
  # automatically.
  gcp_credentials: &gcp_credentials
    options:
      - env: GOOGLE_APPLICATION_CREDENTIALS
      - scope: retail_consumer_goods
        secret: GOOGLE_APPLICATION_CREDENTIALS

  gcp_reasoning_engine_endpoint: &gcp_reasoning_engine_endpoint
    options:
      - env: GCP_REASONING_ENGINE_ENDPOINT
      - scope: retail_consumer_goods
        secret: GCP_REASONING_ENGINE_ENDPOINT

tools:
  # Genie analytics tool — sales, pricing, margins, promotions, revenue.
  sales_pricing_genie_tool: &sales_pricing_genie_tool
    name: sales_pricing_analytics
    function:
      type: factory
      name: dao_ai.tools.create_genie_tool
      args:
        name: sales_pricing_analytics
        description: |
          Query sales and pricing analytics for the sporting goods store. Use
          for questions about sales performance, pricing strategy, margins,
          promotional effectiveness, and revenue trends across stores and
          channels.
        genie_room: *sales_pricing_genie_room

  # GCP ADK agent — customer service domain expertise hosted on Vertex AI.
  gcp_customer_service_tool: &gcp_customer_service_tool
    name: gcp_customer_service
    function:
      type: factory
      name: dao_ai.tools.create_gcp_agent_endpoint_tool
      args:
        name: gcp_customer_service
        description: |
          Delegate customer service queries to a Google Cloud ADK agent
          deployed on Vertex AI Agent Engine. Use for customer-facing
          questions, account inquiries, returns, and general support where a
          conversational customer service agent is appropriate.
        endpoint: *gcp_reasoning_engine_endpoint
        credentials: *gcp_credentials
        # user_id omitted → tool uses runtime.context.user_id so ADK can
        # scope sessions, memory, and personalization per end user.
        # session_id is always sourced from runtime.context.thread_id for
        # multi-turn continuity within a DAO AI conversation.
        class_method: stream_query

agents:
  # Genie analytics worker
  sales_pricing_agent: &sales_pricing_agent
    name: sales_pricing_agent
    description: >
      Specialist for sales performance, pricing strategy, margin analytics,
      promotional effectiveness, and revenue tracking.
    model: *default_llm
    tools:
      - *sales_pricing_genie_tool
    prompt: |
      You are a sales and pricing analytics specialist for a sporting goods
      retailer. Answer questions about:
      - Sales performance across stores, channels, and products
      - Pricing strategy and price elasticity
      - Margin analysis and cost structure
      - Promotional effectiveness and lift analysis
      - Revenue trends and forecasts

      Use the sales_pricing_analytics tool to query the underlying data.
      Be quantitative and cite concrete figures from the tool output.

  # GCP customer service worker
  gcp_customer_service_agent: &gcp_customer_service_agent
    name: gcp_customer_service_agent
    description: >
      Customer service specialist backed by a Google Cloud ADK agent on
      Vertex AI Agent Engine.
    model: *default_llm
    tools:
      - *gcp_customer_service_tool
    prompt: |
      You are a customer service coordinator. For any customer-facing
      question — account inquiries, returns, product support, general
      assistance — delegate to the gcp_customer_service tool, which calls a
      Google Cloud ADK agent. Pass the user's request through as-is and
      relay the response back clearly.

app:
  name: gcp_agent_endpoint_dao
  description: >
    Two-agent system: Genie-powered sales/pricing analytics + GCP-hosted
    customer service agent via Vertex AI Reasoning Engine.
  log_level: INFO

  registered_model:
    schema: *sporting_goods_schema
    name: gcp_agent_endpoint_dao

  agents:
    - *sales_pricing_agent
    - *gcp_customer_service_agent

  orchestration:
    supervisor:
      model: *default_llm
      prompt: |
        You coordinate two specialist agents for a sporting goods retailer:

        - sales_pricing_agent: Handles questions about sales performance,
          pricing, margins, promotions, and revenue. Uses a Databricks
          Genie room backed by analytics data.
        - gcp_customer_service_agent: Handles customer-facing service
          questions via a Google Cloud ADK agent on Vertex AI.

        Route each request to the single most appropriate agent based on
        intent. For analytics / "how are we doing" / pricing / margin
        questions, choose sales_pricing_agent. For customer-facing /
        account / support questions, choose gcp_customer_service_agent.

  input_example:
    messages:
      - role: user
        content: "What were our top-selling categories last quarter?"
