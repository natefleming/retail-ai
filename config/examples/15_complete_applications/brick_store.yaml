# yaml-language-server: $schema=../../../schemas/model_config_schema.json

# =============================================================================
# Brick Store - In-Store Associate Companion
# =============================================================================
# Multi-agent companion for retail floor associates, store managers, and
# personal stylists. Covers the in-store experience: product lookup, real-time
# inventory and nearby-store checks, customer appointment preparation, BOPIS
# pickups, employee task management, and personal styling support.
#
# Architecture:  Supervisor pattern with Lakebase persistent memory.
# Agents:        7 specialized in-store roles.
# Tools:         15 Unity Catalog functions, 1 Genie room (exposed twice for
#                routing clarity), 2 vector retrievers, current_time, app_info.
# Memory:        Lakebase checkpointer + namespaced store + memory extraction.
# Deployment:    Same config deploys to Model Serving and Databricks Apps. All
#                LLMs, vector stores, the warehouse, the Genie room, and every
#                UC function are flagged on_behalf_of_user so they resolve via
#                runtime user credentials and stay outside the Apps 20-resource
#                budget. Only the Lakebase database is service-principal-backed.

# =============================================================================
# VARIABLES
# =============================================================================
variables:
  client_id: &client_id
    options:
      - scope: retail_consumer_goods
        secret: RETAIL_AI_DATABRICKS_CLIENT_ID
      - env: RETAIL_AI_DATABRICKS_CLIENT_ID

  client_secret: &client_secret
    options:
      - scope: retail_consumer_goods
        secret: RETAIL_AI_DATABRICKS_CLIENT_SECRET
      - env: RETAIL_AI_DATABRICKS_CLIENT_SECRET

service_principals:
  retail_consumer_goods_sp: &retail_consumer_goods_sp
    name: retail_consumer_goods_sp
    client_id: *client_id
    client_secret: *client_secret

# =============================================================================
# SCHEMAS
# =============================================================================
schemas:
  brickstore_schema: &brickstore_schema
    catalog_name: retail_consumer_goods
    schema_name: store_ops
    permissions:
      - principals: [users]
        privileges:
          - USE_CATALOG
          - USE_SCHEMA
          - SELECT
          - EXECUTE

# =============================================================================
# RESOURCES
# =============================================================================
resources:
  # ---------------------------------------------------------------------------
  # LANGUAGE MODELS
  # ---------------------------------------------------------------------------
  llms:
    fast_llm: &fast_llm
      name: databricks-gpt-5-4-mini
      temperature: 0.1
      max_tokens: 4096
      on_behalf_of_user: true

    supervisor_llm: &supervisor_llm
      name: databricks-gpt-5-4-mini
      temperature: 0.1
      max_tokens: 1024
      on_behalf_of_user: true

    tool_calling_llm: &tool_calling_llm
      name: databricks-claude-sonnet-4-5
      temperature: 0.1
      max_tokens: 4096
      on_behalf_of_user: true
      fallbacks:
        - databricks-claude-sonnet-4-6

    judge_llm: &judge_llm
      name: databricks-claude-3-7-sonnet
      temperature: 0.5
      max_tokens: 8192

    decomposition_llm: &decomposition_llm
      name: databricks-gpt-5-4-mini
      temperature: 0.0
      max_tokens: 1024
      on_behalf_of_user: true

    embedding_model: &embedding_model
      name: databricks-gte-large-en

  # ---------------------------------------------------------------------------
  # VECTOR STORES
  # ---------------------------------------------------------------------------
  vector_stores:
    products_vector_store: &products_vector_store
      embedding_model: *embedding_model
      on_behalf_of_user: true
      endpoint:
        name: dbdemos_vs_endpoint
        type: STANDARD
      index:
        schema: *brickstore_schema
        name: product_description_index
      source_table:
        schema: *brickstore_schema
        name: products
      primary_key: product_id
      doc_uri: ~
      embedding_source_column: long_description
      columns:
        - product_id
        - sku
        - upc
        - brand_name
        - product_name
        - merchandise_class
        - department_name
        - category_name
        - color
        - size
        - base_price
        - long_description

    stores_vector_store: &stores_vector_store
      embedding_model: *embedding_model
      on_behalf_of_user: true
      endpoint:
        name: dbdemos_vs_endpoint
        type: STANDARD
      index:
        schema: *brickstore_schema
        name: store_details_indexed
      source_table:
        schema: *brickstore_schema
        name: dim_stores
      primary_key: store_id
      doc_uri: ~
      embedding_source_column: store_details_text
      columns:
        - store_id
        - store_name
        - store_address
        - store_city
        - store_state
        - store_details_text

  # ---------------------------------------------------------------------------
  # WAREHOUSES
  # ---------------------------------------------------------------------------
  warehouses:
    brickstore_warehouse: &brickstore_warehouse
      name: "Shared Unity Catalog Serverless"
      description: "Shared serverless warehouse for brick_store demo workloads"
      warehouse_id: 4b9b953939869799
      on_behalf_of_user: true

  # ---------------------------------------------------------------------------
  # GENIE ROOMS
  # ---------------------------------------------------------------------------
  genie_rooms:
    brickstore_genie_room: &brickstore_genie_room
      name: "Brick Store Operations Genie"
      description: >
        Natural-language analytics over the brick_store catalog (products,
        inventory, sales, appointments, employee performance, customer
        feedback) for ad-hoc questions that don't map to a single SKU or
        UPC lookup.
      # space_id is populated by GenieRoomModel.create() during initial
      # provisioning. With it set, subsequent deploys reference the existing
      # space (update mode) instead of creating a new one.
      space_id: 01f14b11e9dd164483458833e7aa840e
      on_behalf_of_user: true
      parent_path: "/Users/nate.fleming@databricks.com/genie"
      warehouse: *brickstore_warehouse
      table_sources:
        - table:
            schema: *brickstore_schema
            name: products
          description: "Product catalog with SKU, UPC, brand, department, category, price."
        - table:
            schema: *brickstore_schema
            name: inventory
          description: "Per-store inventory with on-hand quantity, warehouse backstock, retail amount, popularity, aisle location."
        - table:
            schema: *brickstore_schema
            name: dim_stores
          description: "Store directory: id, name, address, city/state, manager id, hours, type, latitude/longitude, departments offered."
        - table:
            schema: *brickstore_schema
            name: customers
          description: "Customer profiles: tier, preferences (style/size/color/brand), lifetime spend, satisfaction, upcoming appointments, alerts."
        - table:
            schema: *brickstore_schema
            name: employee_performance
          description: "Monthly employee performance: sales achievement, task completion, customer satisfaction, attendance, by department."
        - table:
            schema: *brickstore_schema
            name: employee_tasks
          description: "Per-task assignments: store, employee, type, priority, status, due time, customer/order linkage."
        - table:
            schema: *brickstore_schema
            name: managers
          description: "Manager directory: contact info, department, communication preferences, work schedule."
        - table:
            schema: *brickstore_schema
            name: appointments
          description: "Customer appointment scheduling: type, date/time, store, stylist, status."
      sample_questions:
        - "How many BOPIS-style task assignments are open at store 101 right now?"
        - "Which departments have the highest task completion rate this month?"
        - "What's the average customer satisfaction score by store?"
        - "Which products in Womens Fashion have the highest current inventory?"
        - "How many upcoming appointments are scheduled at each store this week?"

  # ---------------------------------------------------------------------------
  # FUNCTIONS
  # ---------------------------------------------------------------------------
  # NOTE: UC functions are SP-backed (`on_behalf_of_user: false`) because
  # `unitycatalog.ai.core.databricks.DatabricksFunctionClient` runs UC fns via
  # Spark Connect serverless, and the OBO token forwarded by Model Serving
  # does not carry the `databricks-connect` OAuth scope. With OBO=true the
  # tools throw `PERMISSION_DENIED: required scopes: databricks-connect` at
  # runtime. SP path uses the workspace-level credentials and works in both
  # Model Serving and Apps. Counts as 15 entries against the Apps 20-resource
  # budget (15 UC fns + 1 Lakebase = 16, still under 20).
  functions:
    # Product / inventory primitives (existing in functions/brickstore/)
    find_product_by_sku: &find_product_by_sku
      schema: *brickstore_schema
      name: find_product_by_sku
      on_behalf_of_user: false
    find_product_by_upc: &find_product_by_upc
      schema: *brickstore_schema
      name: find_product_by_upc
      on_behalf_of_user: false
    find_inventory_by_sku: &find_inventory_by_sku
      schema: *brickstore_schema
      name: find_inventory_by_sku
      on_behalf_of_user: false
    find_inventory_by_upc: &find_inventory_by_upc
      schema: *brickstore_schema
      name: find_inventory_by_upc
      on_behalf_of_user: false
    find_store_inventory_by_sku: &find_store_inventory_by_sku
      schema: *brickstore_schema
      name: find_store_inventory_by_sku
      on_behalf_of_user: false
    find_store_inventory_by_upc: &find_store_inventory_by_upc
      schema: *brickstore_schema
      name: find_store_inventory_by_upc
      on_behalf_of_user: false
    find_store_by_number: &find_store_by_number
      schema: *brickstore_schema
      name: find_store_by_number
      on_behalf_of_user: false

    # New brick_store SQL functions (functions/brickstore/, written in this PR)
    find_nearby_stores_inventory: &find_nearby_stores_inventory
      schema: *brickstore_schema
      name: find_nearby_stores_inventory
      on_behalf_of_user: false
    find_top_employees_by_department: &find_top_employees_by_department
      schema: *brickstore_schema
      name: find_top_employees_by_department
      on_behalf_of_user: false
    find_personal_shopping_associates: &find_personal_shopping_associates
      schema: *brickstore_schema
      name: find_personal_shopping_associates
      on_behalf_of_user: false
    find_employee_manager: &find_employee_manager
      schema: *brickstore_schema
      name: find_employee_manager
      on_behalf_of_user: false
    find_task_assignments: &find_task_assignments
      schema: *brickstore_schema
      name: find_task_assignments
      on_behalf_of_user: false
    find_upcoming_customer_appointments: &find_upcoming_customer_appointments
      schema: *brickstore_schema
      name: find_upcoming_customer_appointments
      on_behalf_of_user: false
    get_customer_details: &get_customer_details
      schema: *brickstore_schema
      name: get_customer_details
      on_behalf_of_user: false
    get_customer_preparation_summary: &get_customer_preparation_summary
      schema: *brickstore_schema
      name: get_customer_preparation_summary
      on_behalf_of_user: false

  # ---------------------------------------------------------------------------
  # DATABASES (Lakebase) — service-principal-backed for cross-session memory
  # ---------------------------------------------------------------------------
  databases:
    retail_database: &retail_database
      name: "retail-consumer-goods"
      project: "retail-consumer-goods"
      description: "Lakebase Postgres for agent memory checkpoints and namespaced store"
      client_id: *client_id
      client_secret: *client_secret
      on_behalf_of_user: false

# =============================================================================
# RETRIEVERS
# =============================================================================
retrievers:
  products_retriever: &products_retriever
    vector_store: *products_vector_store
    columns:
      - product_id
      - sku
      - upc
      - brand_name
      - product_name
      - merchandise_class
      - department_name
      - category_name
      - color
      - size
      - base_price
      - long_description
    search_parameters:
      num_results: 50
      filters: {}
      query_type: HYBRID
    instructed:
      columns:
        - name: product_id
          type: number
          description: "Unique product identifier"
        - name: sku
          type: string
          description: "Stock keeping unit - internal product code"
        - name: upc
          type: string
          description: "Universal Product Code - barcode number"
        - name: brand_name
          type: string
          description: "Brand or manufacturer (Adidas, Nike, Lululemon, etc.)"
        - name: product_name
          type: string
          description: "Product display name"
        - name: merchandise_class
          type: string
          description: "Broad category (Apparel, Footwear, Electronics, Home Goods, Accessories)"
        - name: department_name
          type: string
          description: "Department (Womens Fashion, Mens Fashion, Electronics, Home Goods, Accessories)"
        - name: category_name
          type: string
          description: "Category within department"
        - name: color
          type: string
          description: "Primary color"
        - name: size
          type: string
          description: "Size specification"
        - name: base_price
          type: number
          description: "Base retail price in USD"
        - name: long_description
          type: string
          description: "Detailed product description"
      constraints:
        - "Use brand_name for brand filtering"
        - "Use merchandise_class for product type filtering"
        - "Use department_name for department-level queries"
        - "Use color or size for fit filtering"
        - "Only use columns listed above"
      decomposition:
        model: *decomposition_llm
        max_subqueries: 3
        rrf_k: 60
        normalize_filter_case: uppercase
        examples:
          - query: "black Adidas Gazelle size 10"
            filters: {"brand_name": "ADIDAS", "merchandise_class": "FOOTWEAR", "color": "BLACK", "size": "10"}
          - query: "designer black handbag under $300"
            filters: {"merchandise_class": "ACCESSORIES", "color": "BLACK"}
          - query: "women's professional dresses"
            filters: {"department_name": "WOMENS FASHION", "merchandise_class": "APPAREL"}
          - query: "Nike running shoes excluding Pegasus"
            filters: {"brand_name": "NIKE", "merchandise_class": "FOOTWEAR"}
      rerank:
        model: *decomposition_llm
        instructions: |
          Prioritize results based on user constraints:
          - Brand preferences: boost specified brands
          - Size: prefer exact size matches when size is given
          - Department: match department_name when stated
          - Price sensitivity: respect any price ranges in the query
        top_n: 10
    rerank:
      model: ms-marco-MiniLM-L-12-v2
      top_n: 20
      columns:
        - brand_name
        - product_name
        - merchandise_class
        - department_name

  stores_retriever: &stores_retriever
    vector_store: *stores_vector_store
    columns:
      - store_id
      - store_name
      - store_address
      - store_city
      - store_state
      - store_details_text
    search_parameters:
      num_results: 10
      filters: {}
      query_type: ANN

# =============================================================================
# TOOLS
# =============================================================================
tools:
  # ---------------------------------------------------------------------------
  # Vector search tools
  # ---------------------------------------------------------------------------
  product_vector_search_tool: &product_vector_search_tool
    name: product_vector_search
    function:
      type: factory
      name: dao_ai.tools.create_vector_search_tool
      args:
        retriever: *products_retriever
        name: product_vector_search_tool
        description: "Search the product catalog by description, brand, department, color, or size. Use when the user describes the product rather than providing a SKU or UPC."

  find_store_details_by_location_tool: &find_store_details_by_location_tool
    name: find_store_details_by_location
    function:
      type: factory
      name: dao_ai.tools.create_vector_search_tool
      args:
        retriever: *stores_retriever
        name: find_store_details_by_location_tool
        description: "Search for store details by location, neighborhood, or store name (e.g., 'Downtown Market', 'Marina'). Returns store id, address, city, state, and full details text."

  # ---------------------------------------------------------------------------
  # Unity Catalog tools — product / inventory / store primitives
  # ---------------------------------------------------------------------------
  find_product_by_sku_tool: &find_product_by_sku_tool
    name: find_product_by_sku_uc
    function:
      type: unity_catalog
      resource: *find_product_by_sku

  find_product_by_upc_tool: &find_product_by_upc_tool
    name: find_product_by_upc_uc
    function:
      type: unity_catalog
      resource: *find_product_by_upc

  find_inventory_by_sku_tool: &find_inventory_by_sku_tool
    name: find_inventory_by_sku_uc
    function:
      type: unity_catalog
      resource: *find_inventory_by_sku

  find_inventory_by_upc_tool: &find_inventory_by_upc_tool
    name: find_inventory_by_upc_uc
    function:
      type: unity_catalog
      resource: *find_inventory_by_upc

  find_store_inventory_by_sku_tool: &find_store_inventory_by_sku_tool
    name: find_store_inventory_by_sku_uc
    function:
      type: unity_catalog
      resource: *find_store_inventory_by_sku

  find_store_inventory_by_upc_tool: &find_store_inventory_by_upc_tool
    name: find_store_inventory_by_upc_uc
    function:
      type: unity_catalog
      resource: *find_store_inventory_by_upc

  find_store_by_number_tool: &find_store_by_number_tool
    name: find_store_by_number_uc
    function:
      type: unity_catalog
      resource: *find_store_by_number

  find_nearby_stores_inventory_tool: &find_nearby_stores_inventory_tool
    name: find_nearby_stores_inventory_uc
    function:
      type: unity_catalog
      resource: *find_nearby_stores_inventory

  # ---------------------------------------------------------------------------
  # Unity Catalog tools — employee / customer / appointments
  # ---------------------------------------------------------------------------
  find_top_employees_by_department_tool: &find_top_employees_by_department_tool
    name: find_top_employees_by_department_uc
    function:
      type: unity_catalog
      resource: *find_top_employees_by_department

  find_personal_shopping_associates_tool: &find_personal_shopping_associates_tool
    name: find_personal_shopping_associates_uc
    function:
      type: unity_catalog
      resource: *find_personal_shopping_associates

  find_employee_manager_tool: &find_employee_manager_tool
    name: find_employee_manager_uc
    function:
      type: unity_catalog
      resource: *find_employee_manager

  find_task_assignments_tool: &find_task_assignments_tool
    name: find_task_assignments_uc
    function:
      type: unity_catalog
      resource: *find_task_assignments

  find_upcoming_customer_appointments_tool: &find_upcoming_customer_appointments_tool
    name: find_upcoming_customer_appointments_uc
    function:
      type: unity_catalog
      resource: *find_upcoming_customer_appointments

  get_customer_details_tool: &get_customer_details_tool
    name: get_customer_details_uc
    function:
      type: unity_catalog
      resource: *get_customer_details

  get_customer_preparation_summary_tool: &get_customer_preparation_summary_tool
    name: get_customer_preparation_summary_uc
    function:
      type: unity_catalog
      resource: *get_customer_preparation_summary

  # ---------------------------------------------------------------------------
  # Genie tools — same room exposed under two names so the supervisor's routing
  # heuristics distinguish "store ops analytics" from "employee insights".
  # ---------------------------------------------------------------------------
  store_ops_analytics_tool: &store_ops_analytics_tool
    name: query_store_ops_analytics
    function:
      type: factory
      name: dao_ai.tools.create_genie_toolkit
      args:
        name: query_store_ops_analytics
        description: >
          Natural-language analytics over store_ops data: sales trends,
          inventory turnover, BOPIS performance, customer feedback,
          appointment volume, and category-level insights. Use for
          aggregate or trend questions, not single-SKU lookups.
        genie_room: *brickstore_genie_room
        lru_cache_parameters:
          warehouse: *brickstore_warehouse
          capacity: 100
          time_to_live_seconds: 3600
          invalidate_on_empty_result: true
        context_aware_cache_parameters:
          database: *retail_database
          warehouse: *brickstore_warehouse
          embedding_model: *embedding_model
          similarity_threshold: 0.85
          time_to_live_seconds: 86400
          invalidate_on_empty_result: true
        persist_conversation: true

  employee_insights_tool: &employee_insights_tool
    name: query_employee_insights
    function:
      type: factory
      name: dao_ai.tools.create_genie_toolkit
      args:
        name: query_employee_insights
        description: >
          Natural-language analytics over employee performance, task
          assignment, and manager data. Use for cross-department or
          cross-store team questions that aren't a single-employee lookup.
        genie_room: *brickstore_genie_room
        lru_cache_parameters:
          warehouse: *brickstore_warehouse
          capacity: 100
          time_to_live_seconds: 3600
          invalidate_on_empty_result: true
        context_aware_cache_parameters:
          database: *retail_database
          warehouse: *brickstore_warehouse
          embedding_model: *embedding_model
          similarity_threshold: 0.85
          time_to_live_seconds: 86400
          invalidate_on_empty_result: true
        persist_conversation: true

  # ---------------------------------------------------------------------------
  # Utility tools
  # ---------------------------------------------------------------------------
  current_time_tool: &current_time_tool
    name: current_time
    function:
      type: python
      name: dao_ai.tools.current_time_tool

  app_info_tool: &app_info_tool
    name: app_info
    function:
      type: factory
      name: dao_ai.tools.create_app_info_tool
      args:
        app_name: "Brick Store Associate Companion"
        description: >
          AI-powered companion for retail floor associates, store managers,
          and personal stylists - covering product lookup, inventory and
          nearby-store checks, customer appointment preparation, BOPIS
          orders, employee performance, and personal styling support.
        agents:
          - name: product
            description: "Product details, SKU/UPC lookup, comparisons, recommendations"
          - name: inventory
            description: "Stock levels, store availability, nearby stores, hold guidance"
          - name: orders
            description: "BOPIS pickups, order tracking, delivery scheduling"
          - name: customer
            description: "Customer profiles, upcoming appointments, prep summaries"
          - name: stylist
            description: "Personal styling sessions and outfit preselection"
          - name: employee
            description: "Top performers, task assignments, manager lookup"
          - name: general
            description: "Store info, hours, services, and other inquiries"
        sample_prompts:
          - "Do you have Adidas Gazelle size 10 black at store 101?"
          - "Who has appointments today at store 101 that I should prep for?"
          - "Tell me about Victoria Sterling - she just walked in"
          - "Find a personal shopper for a 2pm walk-in at store 101"
          - "Who are the top performers in Womens Fashion this month?"
          - "Where is the Marina Market store?"

# =============================================================================
# PROMPTS (MLflow Prompt Registry)
# =============================================================================
prompts:
  general_prompt: &general_prompt
    schema: *brickstore_schema
    name: brickstore_general_prompt
    description: "General-purpose store associate prompt for the brick_store companion"
    default_template: |
      ### User Information
      - **User Id**: {user_id}
      - **Store Number**: {store_num}

      You are a friendly, knowledgeable in-store associate at a multi-format retail
      store. You help fellow associates and store managers with the day-to-day
      questions that don't fall under a specialist agent.

      ## What you cover
      - Store information (hours, location, contact, services)
      - Quick customer lookups when an associate just needs context
      - Upcoming appointments at the store
      - Pointing requests at the right specialist agent

      ## Tool usage
      - Use `find_store_details_by_location` to look up a store by name or location.
      - Use `find_store_by_number_uc` when an associate provides a numeric store id.
      - Use `find_upcoming_customer_appointments_uc` for "what's on the calendar today" questions.
      - Use `get_customer_details_uc` for quick profile lookups.
      - Use `query_store_ops_analytics` for ad-hoc analytical questions ("how did
        store 101 do last week?") that aren't a single record lookup.
      - Use `current_time` when answering time-relative questions.

      ## Response style
      - Keep replies tight and floor-friendly - associates are usually mid-task.
      - When a question clearly belongs to a specialist (product details, deep
        inventory, BOPIS pickup, styling, employee management), defer to that
        agent rather than answering yourself.
    tags:
      environment: production
      agent_name: general
      domain: store_ops
    auto_register: true

  orders_prompt: &orders_prompt
    schema: *brickstore_schema
    name: brickstore_orders_prompt
    description: "BOPIS / order management prompt for the brick_store companion"
    default_template: |
      ### User Information
      - **User Id**: {user_id}
      - **Store Number**: {store_num}

      You are a BOPIS and order-fulfillment specialist for an in-store associate
      working the pickup desk and the floor. Help with everything around picking,
      staging, and handing off online and in-store orders.

      ## What you cover
      - BOPIS (Buy Online Pickup In Store) status, ready-for-pickup verification,
        pickup hand-off, and customer ID checks
      - Cross-channel order tracking (online, mobile app, in-store)
      - Delivery scheduling and modifications
      - Coordinating between pickup desk and the customer's preferred department

      ## Tool usage
      - Use `query_store_ops_analytics` for order-level analytics ("how many BOPIS
        orders are in flight at store 101 right now?", "show me overdue pickups").
      - Use `get_customer_details_uc` to confirm the customer profile before
        handing off the order.
      - Use `current_time` to compute pickup windows and ready-by deadlines.

      ## Holds and reservations
      - Hold placement is currently a narrative-only flow (no write-side tool).
        When asked to place a hold: confirm the SKU, store, and customer, then
        reply with a hold confirmation in the format
        `HOLD-<store_id>-<yyyymmddhhmm>` and include the 24-hour expiration
        window plus pickup instructions. Do NOT claim a row was inserted.

      ## Response style
      - Reference order numbers, customer names, and SKUs explicitly.
      - Flag urgent items (overdue pickups, missed delivery windows).
      - Hand off to the inventory agent for stock checks across stores.
    tags:
      environment: production
      agent_name: orders
      domain: store_ops
    auto_register: true

  product_prompt: &product_prompt
    schema: *brickstore_schema
    name: brickstore_product_prompt
    description: "Product specialist prompt for the brick_store companion (absorbs comparison + recommendation)"
    default_template: |
      ### User Information
      - **User Id**: {user_id}
      - **Store Number**: {store_num}

      You are a product specialist who knows the catalog cold. You handle every
      product-shaped question: lookups, comparisons, and recommendations.

      ## When to use which tool
      - **Customer says "this SKU"**: call `find_product_by_sku_uc` directly.
      - **Customer reads a barcode (UPC)**: call `find_product_by_upc_uc`.
      - **Customer describes the product** ("black Adidas Gazelle size 10",
        "the navy quilted vest"): call `product_vector_search` first, then drill
        in with `find_product_by_sku_uc` for the top hit if more detail is needed.
      - **Comparison or recommendation** ("Adidas Gazelle vs Nike Air Force",
        "what's similar to X"): call `product_vector_search` for each candidate,
        then synthesize a side-by-side or ranked recommendation.
      - **Aggregate / catalog-wide questions** ("which brands sold the most this
        week?", "what's our top-selling color in Womens Fashion?"): use
        `query_store_ops_analytics`.

      ## Workflow examples
      1. "Tell me about SKU PET-KCP-001" -> `find_product_by_sku_uc`.
      2. "Find black leather handbags under $300" -> `product_vector_search`
         (filters: merchandise_class=ACCESSORIES, color=BLACK).
      3. "Compare Adidas Gazelle vs Nike Air Force" -> two `product_vector_search`
         calls, then a side-by-side comparison covering price, materials, fit,
         and use case.

      ## Response style
      - Lead with the answer; supporting specs in a tight bulleted list.
      - When the result includes a price, format it as USD ($129.99).
      - For comparisons, highlight 3-5 key differentiators rather than dumping
        every column.
      - For recommendations, justify each pick in one short sentence.
      - Hand off to inventory when the conversation shifts from "what is it" to
        "do we have it".
    tags:
      environment: production
      agent_name: product
      domain: store_ops
    auto_register: true

  inventory_prompt: &inventory_prompt
    schema: *brickstore_schema
    name: brickstore_inventory_prompt
    description: "Inventory specialist prompt for the brick_store companion"
    default_template: |
      ### User Information
      - **User Id**: {user_id}
      - **Store Number**: {store_num}

      You are an inventory specialist for floor associates: real-time stock
      checks, store-specific lookups, and nearby-store overflow when the home
      store is out.

      ## When to use which tool
      - "Stock at this store" -> `find_store_inventory_by_sku_uc` (or `_by_upc_uc`).
      - "Stock everywhere" -> `find_inventory_by_sku_uc` (or `_by_upc_uc`).
      - "Out at this store, where else?" -> `find_nearby_stores_inventory_uc`,
        passing the customer's reference store and SKU. Returns the closest
        stores by Haversine distance with their on-hand quantity.
      - "Customer described the product, no SKU yet" -> `product_vector_search`
        first to resolve the SKU, then one of the inventory tools.

      ## Holds (narrative only)
      Hold placement is a narrative-only flow at the moment. When asked to place
      a hold: confirm SKU, store, and (when relevant) size/color, then reply with
      `HOLD-<store_id>-<yyyymmddhhmm>` and a 24-hour pickup window. Be explicit
      that the hand-off requires the customer to give the hold ID at pickup.

      ## Out-of-stock workflow
      1. Detect the zero-quantity result (`store_quantity = 0`).
      2. Tell the user it's out at the home store.
      3. Call `find_nearby_stores_inventory_uc` with the home store id.
      4. If still empty, fall back to `product_vector_search` to suggest similar
         products by department/category, then check inventory on the top hit.

      ## Response style
      - Always include `store_id`, on-hand `store_quantity`, and `aisle_location`
        when available.
      - For nearby-store results, lead with distance and quantity.
      - Be honest when nothing's in stock - suggest a hold at a nearby store
        rather than promising what isn't there.
    tags:
      environment: production
      agent_name: inventory
      domain: store_ops
    auto_register: true

  customer_prompt: &customer_prompt
    schema: *brickstore_schema
    name: brickstore_customer_prompt
    description: "Customer service / pre-visit prep prompt for the brick_store companion"
    default_template: |
      ### User Information
      - **User Id**: {user_id}
      - **Store Number**: {store_num}

      You help store associates and managers prepare for upcoming customer
      visits. Your specialty is the "who's coming in today and what should I
      have ready" workflow.

      ## When to use which tool
      - "Who has appointments today/this week at my store?" ->
        `find_upcoming_customer_appointments_uc` (pass `[store_num]` as the
        store_id array and a sensible `days_ahead`).
      - "Tell me about <customer name or id>" -> `get_customer_details_uc`.
      - "Pull the prep sheet for <customer>" ->
        `get_customer_preparation_summary_uc`. This returns sizes, colors,
        brand preferences, accessibility needs, and hours-until-appointment.
      - "Pull a couple things in their size before they arrive" ->
        `get_customer_preparation_summary_uc` (for sizes / preferences) +
        `product_vector_search` (filtered by those preferences) +
        `find_inventory_by_sku_uc` to confirm stock.

      ## Manager-greeting flag
      The prep summary includes `requires_manager_greeting`. When that flag is
      true, surface it at the top of your reply and recommend looping in the
      manager-on-duty.

      ## Privacy
      - Share only the data the requester needs for the visit.
      - Treat `customer_alerts`, `dietary_restrictions`, and
        `accessibility_needs` as sensitive - use them to prepare service, not
        for casual mention.

      ## Response style
      - Lead with the customer name and arrival time ("Victoria Sterling arrives
        in 2h - here's the prep:").
      - Bullet the preferences that the associate needs at arms-reach.
      - Suggest 2-3 concrete prep actions (pull size 4 dresses in navy, set up
        the dressing room with sparkling water, etc.).
    tags:
      environment: production
      agent_name: customer
      domain: store_ops
    auto_register: true

  stylist_prompt: &stylist_prompt
    schema: *brickstore_schema
    name: brickstore_stylist_prompt
    description: "Personal stylist prompt for the brick_store companion"
    default_template: |
      ### User Information
      - **User Id**: {user_id}
      - **Store Number**: {store_num}

      You are a personal stylist supporting an active styling session. Your
      partner is the stylist on the floor; your job is to feed them the right
      data, the right outfits, and the right inventory in the moment.

      ## When to use which tool
      - "Pull <customer>'s prep sheet" -> `get_customer_preparation_summary_uc`.
      - "What does <customer> like?" -> `get_customer_details_uc`.
      - "Show me dresses in their size and brand preferences" ->
        `product_vector_search` filtered with the data from the prep sheet
        (size, brand_preferences, color_preferences).
      - "Is the navy Lululemon dress in stock at my store?" ->
        `find_store_inventory_by_sku_uc`.
      - "Who's the best personal shopper available now?" ->
        `find_personal_shopping_associates_uc`.

      ## Outfit-building loop
      1. Get the prep summary.
      2. Build a 3-look capsule (everyday, polished, statement) from
         `product_vector_search` results filtered by the prep data.
      3. For each look, call `find_inventory_by_sku_uc` to confirm at least one
         size is in stock at the customer's preferred store; suggest the
         nearest substitute when not.
      4. Hand the stylist the SKUs + aisle locations so they can pull pieces
         before the customer arrives.

      ## Response style
      - Be concrete: SKU, color, size, aisle, price.
      - When confidence is low (e.g., we don't have the customer's size in the
        exact color), say so and offer the nearest match.
    tags:
      environment: production
      agent_name: stylist
      domain: store_ops
    auto_register: true

  employee_prompt: &employee_prompt
    schema: *brickstore_schema
    name: brickstore_employee_prompt
    description: "Employee / manager-on-duty prompt for the brick_store companion"
    default_template: |
      ### User Information
      - **User Id**: {user_id}
      - **Store Number**: {store_num}

      You are an on-duty manager's companion: top performers, task status,
      manager lookups, and team-level analytics.

      ## When to use which tool
      - "Top N in <department>" -> `find_top_employees_by_department_uc`.
      - "Best personal shopping associates available" ->
        `find_personal_shopping_associates_uc`.
      - "Who's <employee>'s manager?" -> `find_employee_manager_uc`.
      - "What's on <employee>'s plate today?" or "Show open tasks at this store"
        -> `find_task_assignments_uc` (pass `[store_num]` and an optional status
        like `Pending` or `In_Progress`).
      - Cross-team or trend questions ("how is task completion trending across
        stores this month?") -> `query_employee_insights`.

      ## Privacy
      - Only share the data the requester needs to make a decision.
      - Avoid sharing individual performance scores in a way that ranks
        publicly; if you have to rank, focus on the top 3-5 and emphasize
        what they did well, not who's at the bottom.

      ## Response style
      - Lead with names and a one-line "why they stand out".
      - Include manager contact info (email/phone/Slack) when the requester is
        clearly going to follow up.
      - Surface overdue tasks (`is_overdue = true`) at the top of any task list.
    tags:
      environment: production
      agent_name: employee
      domain: store_ops
    auto_register: true

# =============================================================================
# MEMORY (Lakebase)
# =============================================================================
memory: &memory
  checkpointer:
    name: default_checkpointer
    database: *retail_database

  store:
    name: default_store
    database: *retail_database
    namespace: "{user_id}"
    embedding_model: *embedding_model

  extraction:
    schemas:
      - user_profile
      - preference
      - episode
    instructions: |
      Extract the user's role (associate, manager, stylist, pickup-desk),
      their `store_num`, their typical workflow (in-aisle assist, BOPIS pickup,
      appointment prep, active styling, manager-on-duty), and any customers,
      products, or departments they reference frequently. Track preferred
      shifts and stores. Record notable interactions: hold placements, prep
      sessions, BOPIS pickups, styling outcomes, and overdue task flags.
    auto_inject: true
    auto_inject_limit: 5
    background_extraction: true
    extraction_model: *tool_calling_llm
    query_model: *fast_llm

# =============================================================================
# MIDDLEWARE
# =============================================================================
middleware:
  store_validation: &store_validation
    name: dao_ai.middleware.create_custom_field_validation_middleware
    args:
      fields:
        - name: store_num
          description: "Your store number for inventory, customer, and task lookups"
          example_value: "101"
        - name: user_id
          description: "Your unique user identifier"
          required: false
          example_value: "associate_01"

# =============================================================================
# AGENTS
# =============================================================================
agents:
  general: &general
    name: general
    description: "General store associate for store info, store search, and quick customer/appointment context"
    model: *tool_calling_llm
    tools:
      - *current_time_tool
      - *find_store_details_by_location_tool
      - *find_store_by_number_tool
      - *find_upcoming_customer_appointments_tool
      - *get_customer_details_tool
      - *store_ops_analytics_tool
    guardrails: []
    prompt: *general_prompt
    handoff_prompt: "Store info, hours, location, services, quick customer lookups, or any inquiry that doesn't clearly belong to a specialist."

  orders: &orders
    name: orders
    description: "BOPIS and order fulfillment specialist for pickup, staging, and order tracking"
    model: *tool_calling_llm
    tools:
      - *current_time_tool
      - *get_customer_details_tool
      - *store_ops_analytics_tool
    guardrails: []
    prompt: *orders_prompt
    handoff_prompt: "BOPIS pickups, online order status, in-store order tracking, delivery scheduling, or hold confirmations (narrative)."

  product: &product
    name: product
    description: "Product specialist covering catalog lookup, comparisons, and recommendations"
    model: *tool_calling_llm
    tools:
      - *product_vector_search_tool
      - *find_product_by_sku_tool
      - *find_product_by_upc_tool
      - *store_ops_analytics_tool
    guardrails: []
    prompt: *product_prompt
    handoff_prompt: "Product details, SKU/UPC lookups, side-by-side comparisons, or 'what's similar to X' recommendations."

  inventory: &inventory
    name: inventory
    description: "Inventory specialist for stock checks at the home store and nearby stores"
    model: *tool_calling_llm
    tools:
      - *find_inventory_by_sku_tool
      - *find_inventory_by_upc_tool
      - *find_store_inventory_by_sku_tool
      - *find_store_inventory_by_upc_tool
      - *find_nearby_stores_inventory_tool
      - *product_vector_search_tool
    guardrails: []
    prompt: *inventory_prompt
    handoff_prompt: "Stock levels at this store, nearby-store availability, out-of-stock alternatives, or hold guidance."

  customer: &customer
    name: customer
    description: "Customer service specialist for upcoming-visit prep and customer profile context"
    model: *tool_calling_llm
    tools:
      - *find_upcoming_customer_appointments_tool
      - *get_customer_details_tool
      - *get_customer_preparation_summary_tool
      - *product_vector_search_tool
      - *find_inventory_by_sku_tool
    guardrails: []
    prompt: *customer_prompt
    handoff_prompt: "Upcoming customer appointments, pre-visit preparation, customer profile lookups, or 'who's coming in today'."

  stylist: &stylist
    name: stylist
    description: "Personal stylist for active styling sessions, outfit selection, and inventory preselection"
    model: *tool_calling_llm
    tools:
      - *get_customer_details_tool
      - *get_customer_preparation_summary_tool
      - *product_vector_search_tool
      - *find_store_inventory_by_sku_tool
      - *find_personal_shopping_associates_tool
    guardrails: []
    prompt: *stylist_prompt
    handoff_prompt: "Personal styling sessions, outfit building, inventory preselection by customer preference, or finding an available stylist."

  employee: &employee
    name: employee
    description: "Manager-on-duty specialist for top performers, task assignments, and manager lookups"
    model: *tool_calling_llm
    tools:
      - *find_top_employees_by_department_tool
      - *find_personal_shopping_associates_tool
      - *find_employee_manager_tool
      - *find_task_assignments_tool
      - *employee_insights_tool
    guardrails: []
    prompt: *employee_prompt
    handoff_prompt: "Top performers, employee performance, task assignments, overdue tasks, or 'who's <employee>'s manager'."

# =============================================================================
# APPLICATION
# =============================================================================
app:
  name: brick_store_dao
  description: >
    Multi-agent in-store associate companion for a multi-format retail store.
    Covers product lookup, inventory, BOPIS orders, customer appointment prep,
    personal styling, and manager-on-duty employee oversight. Deploys to both
    Model Serving and Databricks Apps from the same config.
  log_level: DEBUG
  registered_model:
    schema: *brickstore_schema
    name: brick_store_dao
  endpoint_name: brick_store_dao
  monitoring:
    sample_rate: 1.0
    scorers:
      - safety
      - completeness
      - relevance_to_query
      - tool_call_efficiency
    guidelines_sample_rate: 0.5
    guidelines:
      - name: customer_service_accuracy
        guidelines:
          - Inventory counts and stock levels must come from tool results, never fabricated
          - Customer profile data, appointment details, and preparation summaries must be sourced from UC function results
          - Hold IDs are narrative-only ("HOLD-<store_id>-<yyyymmddhhmm>") - never claim a hold row was inserted
          - Stylist notifications are narrative-only - draft the message text and tell the user to send it
      - name: tool_usage_quality
        guidelines:
          - SKU and UPC lookups must use the corresponding `find_*_by_sku_uc` / `find_*_by_upc_uc` tool, not Genie
          - Genie analytics tools should be used for trends and aggregates, not single-record lookups
          - Vector search should be used when the user describes a product rather than naming a SKU
          - When stock is zero at the home store, the agent must call `find_nearby_stores_inventory_uc` before suggesting alternatives
      - name: response_professionalism
        guidelines:
          - Responses use floor-friendly language - associates are usually mid-task
          - Currency values use USD formatting with a `$` prefix
          - When the customer profile has `requires_manager_greeting=true`, that flag must be surfaced
          - Privacy-sensitive customer fields (alerts, dietary, accessibility) are only used to prepare service, not casually mentioned
  environment_vars:
    RETAIL_AI_DATABRICKS_CLIENT_ID: "{{secrets/retail_consumer_goods/RETAIL_AI_DATABRICKS_CLIENT_ID}}"
    RETAIL_AI_DATABRICKS_CLIENT_SECRET: "{{secrets/retail_consumer_goods/RETAIL_AI_DATABRICKS_CLIENT_SECRET}}"
    RETAIL_AI_DATABRICKS_HOST: "{{secrets/retail_consumer_goods/RETAIL_AI_DATABRICKS_HOST}}"
  tags:
    business: rcg
    streaming: true
    use_case: in_store_associate
  enable_chat_proxy: true

  permissions:
    - principals: [users]
      entitlements:
        - CAN_QUERY
  agents:
    - *general
    - *orders
    - *product
    - *inventory
    - *customer
    - *stylist
    - *employee
  orchestration:
    memory: *memory
    supervisor:
      model: *supervisor_llm
      tools:
        - *app_info_tool
      prompt: |
        You are a routing coordinator for an in-store associate companion. You do
        NOT answer questions yourself. Your only job is to read the request and
        hand off to the most appropriate specialist agent using the handoff tools.

        IMPORTANT: You do NOT have access to product data, inventory systems,
        customer records, employee data, or any tools. You MUST hand off every
        request to one of: general, orders, product, inventory, customer, stylist,
        employee. Never attempt to answer a substantive question yourself.
      middleware:
        - *store_validation
  input_example:
    messages:
      - role: user
        content: "Do you have Adidas Gazelle size 10 in black at store 101?"
    custom_inputs:
      configurable:
        user_id: associate_01
        store_num: "101"
      session: {}

# =============================================================================
# UNITY CATALOG FUNCTIONS
# =============================================================================
unity_catalog_functions:
  # Product / inventory primitives (existing SQL files)
  - function: *find_product_by_sku
    ddl: ../functions/brickstore/find_product_by_sku.sql
    test:
      parameters:
        sku: ["STB-KCP-001"]

  - function: *find_product_by_upc
    ddl: ../functions/brickstore/find_product_by_upc.sql
    test:
      parameters:
        upc: ["012345678901"]

  - function: *find_inventory_by_sku
    ddl: ../functions/brickstore/find_inventory_by_sku.sql
    test:
      parameters:
        sku: ["PET-KCP-001"]

  - function: *find_inventory_by_upc
    ddl: ../functions/brickstore/find_inventory_by_upc.sql
    test:
      parameters:
        upc: ["123456789012"]

  - function: *find_store_inventory_by_sku
    ddl: ../functions/brickstore/find_store_inventory_by_sku.sql
    test:
      parameters:
        store_id: 101
        sku: ["DUN-KCP-001"]

  - function: *find_store_inventory_by_upc
    ddl: ../functions/brickstore/find_store_inventory_by_upc.sql
    test:
      parameters:
        store_id: 101
        upc: ["234567890123"]

  - function: *find_store_by_number
    ddl: ../functions/brickstore/find_store_by_number.sql
    test:
      parameters:
        store_ids: [1, 2]

  # New brick_store SQL functions
  - function: *find_nearby_stores_inventory
    ddl: ../functions/brickstore/find_nearby_stores_inventory.sql
    test:
      parameters:
        reference_store_id: 101
        sku: ["PET-KCP-001"]
        max_results: 3

  - function: *find_top_employees_by_department
    ddl: ../functions/brickstore/find_top_employees_by_department.sql
    test:
      parameters:
        department_name: "Womens Fashion"
        limit_count: 5

  - function: *find_personal_shopping_associates
    ddl: ../functions/brickstore/find_personal_shopping_associates.sql
    test:
      parameters:
        limit_count: 5

  - function: *find_employee_manager
    ddl: ../functions/brickstore/find_employee_manager.sql
    test:
      parameters:
        employee_id: ["EMP-016"]

  - function: *find_task_assignments
    ddl: ../functions/brickstore/find_task_assignments.sql
    test:
      parameters:
        store_id: []
        task_status_filter: ""

  - function: *find_upcoming_customer_appointments
    ddl: ../functions/brickstore/find_upcoming_customer_appointments.sql
    test:
      parameters:
        store_id: []
        days_ahead: 30

  - function: *get_customer_details
    ddl: ../functions/brickstore/get_customer_details.sql
    test:
      parameters:
        customer_lookup: "CUST-005"

  - function: *get_customer_preparation_summary
    ddl: ../functions/brickstore/get_customer_preparation_summary.sql
    test:
      parameters:
        customer_id: ["CUST-005"]

# =============================================================================
# EVALUATION
# =============================================================================
evaluation:
  model: *judge_llm
  table:
    schema: *brickstore_schema
    name: evaluation
  num_evals: 25
  replace: false
  agent_description: |
    A multi-agent in-store associate companion for a multi-format retail store
    (apparel, footwear, accessories, electronics, home goods). The system has
    7 specialized agents covering the in-store experience:
    1. General - store info, hours, services, store/customer search
    2. Orders - BOPIS pickups, order tracking, delivery scheduling
    3. Product - catalog lookup, comparisons, recommendations
    4. Inventory - real-time stock checks at home store and nearby stores
    5. Customer - pre-visit preparation, customer profile context, appointments
    6. Stylist - personal styling sessions, outfit and inventory preselection
    7. Employee - top performers, task status, manager lookup
    The system serves floor associates, pickup-desk associates, managers-on-duty,
    and personal stylists across stores like Downtown Market, Marina Market, etc.
  question_guidelines: |
    # User personas
    - A floor associate helping a customer find a product in their size
    - A pickup-desk associate processing a BOPIS order
    - A manager-on-duty preparing for a busy afternoon
    - A personal stylist getting ready for a 2pm styling session
    - A new associate looking up store information

    # Example questions
    - Do you have Adidas Gazelle size 10 in black at store 101?
    - The Gazelles are out at 101 - which nearby stores have them?
    - Tell me about Victoria Sterling, she just walked in
    - Who has appointments today at store 101 that I should prep for?
    - I have a styling session with CUST-005 at 2pm, what should I pull?
    - Who are the top 5 personal shoppers in Womens Fashion this month?
    - Who is EMP-016's manager and how do I reach them?
    - What overdue tasks are open at store 101 right now?
    - Where is the Marina Market store and what are its hours?
    - Compare Adidas Gazelle vs Nike Air Force 1

    # Additional Guidelines
    - Questions should reflect real in-store associate workflows
    - Cover all 7 agents in roughly equal proportion
    - Mix concrete lookups (SKU, customer id) with descriptive ("black handbag")
      to exercise both UC functions and vector search
    - Reference real entities from the catalog (CUST-005, EMP-016, store 101,
      brands like Adidas / Nike / Lululemon)
    - Include at least 3 questions that should route to the Genie analytics tool
  custom_inputs:
    configurable:
      user_id: associate_01
      store_num: "101"
    session: {}
  guidelines:
    - name: in_store_relevance
      guidelines:
        - Responses must be relevant to in-store retail operations
        - Inventory and customer data must come from tool results
        - When stock is zero at the home store, nearby stores must be checked before suggesting alternatives
        - Hold and stylist-notification flows are narrative-only and must be framed as such
        - Privacy-sensitive customer fields (alerts, dietary, accessibility) must only be used to prepare service

# =============================================================================
# DATASETS
# =============================================================================
datasets:
  # Core product and inventory tables
  - table:
      schema: *brickstore_schema
      name: products
    ddl: ../data/brickstore/products.sql
    data: ../data/brickstore/product_data.sql
    format: sql

  - table:
      schema: *brickstore_schema
      name: inventory
    ddl: ../data/brickstore/inventory.sql
    data: ../data/brickstore/inventory_data.sql
    format: sql

  - table:
      schema: *brickstore_schema
      name: appointments
    ddl: ../data/brickstore/appointments.sql
    data: ../data/brickstore/appointments_data.sql
    format: sql

  # Store dimension
  - table:
      schema: *brickstore_schema
      name: dim_stores
    ddl: ../data/brickstore/dim_stores.sql
    data: ../data/brickstore/dim_stores_data.sql
    format: sql

  # Employee + tasks + managers (also creates the views the new UC fns wrap)
  - table:
      schema: *brickstore_schema
