# yaml-language-server: $schema=../../../schemas/model_config_schema.json


# =============================================================================
# PARAMETERS
# =============================================================================
parameters:
  catalog:
    description: Unity Catalog catalog name
    default: retail_consumer_goods
  schema:
    description: Schema within the catalog
    default: hardware_store
  llm:
    description: Chat/reasoning serving endpoint used by the agent
    default: databricks-claude-sonnet-5
  lakebase_project:
    description: Lakebase project backing the checkpointer + long-running responses store
    default: retail-consumer-goods

# =============================================================================
# Long-Running Agent Example — Deep Research (aws-field-eng / retail-consumer-goods)
# =============================================================================
# Responses-API-compatible kickoff / poll / cancel for long-running agent tasks
# (< 30 min). Deploys to both Databricks Apps (strict /v1/responses* routes) and
# Model Serving (same semantics via /invocations + custom_inputs).
# Persistence reuses the retail-consumer-goods autoscaling Lakebase project.

variables:
  client_id: &client_id
    options:
    - scope: retail_consumer_goods
      secret: RETAIL_AI_DATABRICKS_CLIENT_ID
    - env: RETAIL_AI_DATABRICKS_CLIENT_ID

  client_secret: &client_secret
    options:
    - scope: retail_consumer_goods
      secret: RETAIL_AI_DATABRICKS_CLIENT_SECRET
    - env: RETAIL_AI_DATABRICKS_CLIENT_SECRET

# =============================================================================
# SCHEMAS
# =============================================================================
schemas:
  retail_schema: &retail_schema
    catalog_name: ${var.catalog}
    schema_name: ${var.schema}
    permissions:
    - principals: [users]
      privileges:
      - USE_CATALOG
      - USE_SCHEMA
      - SELECT
      - EXECUTE

# =============================================================================
# RESOURCES
# =============================================================================
resources:
  models:
    default_llm: &default_llm
      name: ${var.llm}
      max_tokens: 2048

  databases:
    retail_database: &retail_database
      name: "Retail and Consumer Goods Database"
      project: ${var.lakebase_project}
      description: "Lakebase for checkpointer + long-running responses"
      client_id: *client_id
      client_secret: *client_secret
      on_behalf_of_user: false

# =============================================================================
# MEMORY
# =============================================================================
memory:
  checkpointer:
    name: background_checkpointer
    database: *retail_database

# =============================================================================
# AGENTS
# =============================================================================
agents:
  researcher: &researcher
    name: researcher
    description: "Deep-research agent that takes its time to produce a thorough answer"
    model: *default_llm
    prompt: |
      You are a deep-research agent. Produce a detailed, well-structured answer.
      Take your time and think step-by-step. When you have enough information,
      return a comprehensive response.

# =============================================================================
# APPLICATION
# =============================================================================
app:
  name: background_dao
  description: "Background deep-research agent (demo of background kickoff + poll)"
  log_level: INFO

  registered_model:
    schema: *retail_schema
    name: background_dao

  endpoint_name: background_dao

  environment_vars:
    RETAIL_AI_DATABRICKS_CLIENT_ID: "{{secrets/retail_consumer_goods/RETAIL_AI_DATABRICKS_CLIENT_ID}}"
    RETAIL_AI_DATABRICKS_CLIENT_SECRET: "{{secrets/retail_consumer_goods/RETAIL_AI_DATABRICKS_CLIENT_SECRET}}"

  tags:
    business: rcg
    feature: background_agents

  permissions:
  - principals: [users]
    entitlements:
    - CAN_QUERY

  agents:
  - *researcher

  background:
    database: *retail_database
    default_enabled: false
    max_duration_seconds: 1800
    poll_interval_seconds: 1.0

  input_example:
    messages:
    - role: user
      content: "What is Databricks Lakebase?"
    custom_inputs:
      configurable:
        thread_id: "deep_research_demo_1"
