# yaml-language-server: $schema=../../../schemas/model_config_schema.json

# =============================================================================
# AI Gateway routing for InferenceEndpointModel
# =============================================================================
# Demonstrates the `use_ai_gateway: true` flag, which routes a model
# through the Databricks AI Gateway (base URL
# https://<host>/ai-gateway/mlflow/v1) instead of the legacy
# /serving-endpoints/<name>/invocations path. The flag is additive
# and OFF by default — existing configs are unaffected.
#
# The key was `ai_gateway` before dao-ai 0.2.9; the legacy spelling still
# parses via a validation alias, so older configs keep working.
#
# When use_ai_gateway is true:
# - dao-ai constructs a ChatUnityAIGateway (a ChatDatabricks subclass with
#   use_ai_gateway=True defaulted, so gateway calls get their own class name
#   in MLflow traces); the `name` field becomes the OpenAI-style model id
#   sent in the request body.
# - use_responses_api composes with it — dao-ai always uses
#   /ai-gateway/mlflow/v1, which serves both /chat/completions and /responses.
#   Three caveats. Tool calls fail on every model: the gateway cannot parse a
#   function_call content item, so any turn that calls a tool — including every
#   supervisor/swarm handoff — returns INVALID_PARAMETER_VALUE. Use the pairing
#   only for a single agent with no tools. And whether a /responses reply
#   parses depends on the model: gpt-5-4, gpt-5-4-mini and gpt-5-mini work;
#   gpt-oss-120b and claude-sonnet-4-5 omit the token-details fields langchain
#   requires and fail on usage_metadata, so use /chat/completions (the default)
#   for those. A custom ResponsesAgent endpoint is not addressable through the
#   gateway at all — reach one with use_responses_api: true and
#   use_ai_gateway: false.
# - on_behalf_of_user is currently permitted pending live verification;
#   confirm against your workspace before relying on OBO with AI Gateway.
#
# The gateway addresses models as UC securables, so a model id can also be a
# three-level name. All three spellings below work; see `uc_securable_llm`
# and `anchored_llm` under resources.models.

parameters:
  catalog:
    description: Unity Catalog catalog name
    default: retail_consumer_goods
  schema:
    description: Schema within the catalog
    default: hardware_store
  # Model endpoints are parameterized so defaults are overridable per
  # environment (e.g. --param llm=databricks-claude-sonnet-5) without editing
  # the config. Defaults track current GA Foundation Model API endpoints.
  llm:
    description: Chat/reasoning serving endpoint (AI Gateway routed).
    default: databricks-claude-opus-4-6
  fallback_llm:
    description: Fallback chat serving endpoint.
    default: databricks-claude-sonnet-5

schemas:
  retail_schema: &retail_schema
    catalog_name: ${var.catalog}
    schema_name: ${var.schema}

  # NOTE: do not add a `system.ai` schema here. Entries under top-level
  # `schemas:` are provisioned (CREATE SCHEMA) and SP-granted at deploy — the
  # reserved `system` catalog is neither creatable nor grantable that way. To
  # qualify a UC-securable model name, put the schema *inline* on the model
  # (see `anchored_llm` below), not in this map.

resources:
  models:
    # New path — Foundation Model served via AI Gateway.
    gateway_llm: &gateway_llm
      name: ${var.llm}
      use_ai_gateway: true
      temperature: 0.1
      max_tokens: 1024

    # UC-securable model name, spelled out in full. No `schema` needed —
    # a three-level `name` is used verbatim. Either spelling requires
    # `use_ai_gateway: true`; the legacy serving path 404s on a three-level name.
    uc_securable_llm: &uc_securable_llm
      name: system.ai.claude-sonnet-4-5
      use_ai_gateway: true
      max_tokens: 1024

    # Same model, addressed through an inline schema + the short model name.
    # `full_name` resolves to system.ai.claude-sonnet-4-5, exactly as above.
    # The schema is inline (not a top-level `schemas:` anchor) because that map
    # is provisioned and granted — see the note under `schemas:`.
    anchored_llm: &anchored_llm
      schema:
        catalog_name: system
        schema_name: ai
      name: claude-sonnet-4-5
      use_ai_gateway: true
      max_tokens: 1024

    # Legacy path — same workspace, no flag, unchanged behavior.
    legacy_llm: &legacy_llm
      name: ${var.fallback_llm}
      max_tokens: 1024

    # Fallbacks: a bare fallback string inherits the primary's routing, so this
    # fallback is reached through the AI Gateway too. Both clients are LangChain
    # Runnables, so with_fallbacks composes them without further configuration.
    # (For a legacy-path fallback, spell it as a full model with
    # use_ai_gateway: false rather than a bare string.)
    resilient_llm: &resilient_llm
      name: ${var.llm}
      use_ai_gateway: true
      temperature: 0.1
      max_tokens: 1024
      fallbacks:
      - ${var.fallback_llm}

agents:
  gateway_agent: &gateway_agent
    name: gateway_agent
    model: *gateway_llm
    prompt: |
      You are a helpful assistant served via the Databricks AI Gateway.

app:
  name: ai_gateway_example
  log_level: INFO
  registered_model:
    schema: *retail_schema
    name: ai_gateway_example
  agents:
  - *gateway_agent

  # MLflow trace persistence on Databricks Apps requires `trace_location` —
  # the default control-plane trace export targets a storage host
  # (us-east-1.storage.cloud.databricks.com) that Apps containers cannot
  # reach, so spans are silently dropped. Setting `trace_location` routes
  # export through a SQL warehouse to UC OTEL tables, which Apps CAN reach.
  # Local notebook/CLI runs and Model Serving deploys are unaffected and
  # continue using the default control-plane path regardless of this setting.
  #
  # `schema` accepts a SchemaModel anchor (preferred) — reusing *retail_schema
  # keeps the OTEL trace tables in the same UC schema as your app data.
  # `warehouse` accepts a WarehouseModel anchor or a bare warehouse-id string.
  # `table_prefix` (optional) namespaces the OTEL tables — final names become
  # ``<catalog>.<schema>.<prefix>_otel_{spans,logs,metrics,annotations}``.
  # Without a prefix, MLflow uses the experiment_id as the prefix, which
  # works but is less readable when multiple agents share a schema.
  #
  # trace_location:
  #   schema: *retail_schema
  #   warehouse: "your-warehouse-id"
  #   table_prefix: ai_gateway_example   # optional
