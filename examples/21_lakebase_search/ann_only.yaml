# yaml-language-server: $schema=../../../schemas/model_config_schema.json

# Minimal Lakebase Search agent — ANN (semantic) mode only.
#
# Prerequisites:
#   1. Lakebase Search enabled on your project (workspace UI → Compute →
#      Postgres → <project> → Settings → Enable Lakebase Search).
#   2. Extensions installed in the target database:
#        CREATE EXTENSION IF NOT EXISTS lakebase_vector CASCADE;
#   3. A table with a VECTOR(N) column (N must match the embedding endpoint's
#      output dimension — 1024 for databricks-gte-large-en).
#   4. A lakebase_ann index on the vector column:
#        CREATE INDEX ON kb_articles USING lakebase_ann (embedding vector_cosine_ops);
#
# ANN mode never touches the tsvector_column / lakebase_bm25 index, so you
# can omit those entirely for an ANN-only deployment.
#
# Override any parameter at bundle-gen time:
#   dao-ai generate-agent -c ann_only.yaml --var lakebase_project=my-project

parameters:
  lakebase_project:
    description: Lakebase autoscaling Postgres project id
    default: my-lakebase-project
  schema_name:
    description: Postgres schema holding the KB table
    default: dao_ai_kb
  table_name:
    description: Table with vector + text columns
    default: kb_articles
  # Lakebase currently requires SP credentials for programmatic access
  # inside a Databricks App. Configure the secret scope + keys here so the
  # deployed App reads the SP creds from a Databricks secret scope; env-var
  # fallbacks are used for local dev.
  secret_scope:
    description: Databricks secret scope holding the SP client id / secret / host
    default: my_secret_scope
  sp_client_id_key:
    description: Secret-scope key for the SP client id
    default: SP_CLIENT_ID
  sp_client_secret_key:
    description: Secret-scope key for the SP client secret
    default: SP_CLIENT_SECRET
  workspace_host_key:
    description: Secret-scope key for the Databricks workspace host URL
    default: DATABRICKS_HOST

# Anchored option lists — dao-ai's ``value_of`` picks the first option that
# resolves. Prefer secret scope (deploy path); fall back to env var (local
# dev). Any option may be null; unresolved options are skipped.
variables:
  client_id: &client_id
    options:
      - scope: ${var.secret_scope}
        secret: ${var.sp_client_id_key}
      - env: ${var.sp_client_id_key}
  client_secret: &client_secret
    options:
      - scope: ${var.secret_scope}
        secret: ${var.sp_client_secret_key}
      - env: ${var.sp_client_secret_key}
  workspace_host: &workspace_host
    options:
      - scope: ${var.secret_scope}
        secret: ${var.workspace_host_key}
      - env: ${var.workspace_host_key}

resources:
  models:
    default_llm: &default_llm
      name: databricks-claude-sonnet-4-5

  databases:
    kb_lakebase: &kb_lakebase
      project: ${var.lakebase_project}
      client_id: *client_id
      client_secret: *client_secret
      workspace_host: *workspace_host

  # Register the vector store under `resources.vector_stores` so multiple
  # retrievers can share one definition (dao-ai 0.1.108+). The `type:`
  # discriminator selects the concrete class — either `ai_search` (default,
  # AiSearchVectorStoreModel) or `lakebase_search` (LakebaseVectorStoreModel).
  vector_stores:
    kb_ann_vs: &kb_ann_vs
      type: lakebase_search
      database: *kb_lakebase
      schema_name: ${var.schema_name}
      table: ${var.table_name}
      content_column: passage
      embedding_column: embedding
      embedding_model: databricks-gte-large-en   # string shorthand → InferenceEndpointModel
      metadata_columns:
        - category
        - source_url
      distance_metric: cosine                    # cosine | l2 | ip

# Top-level retrievers block — same shape ai_search uses. Tools reference
# these by anchor rather than inlining the retriever config into
# ``function.retriever``.
retrievers:
  kb_ann: &kb_ann
    type: lakebase_search
    vector_store: *kb_ann_vs                     # reference the registered store

tools:
  kb_search: &kb_search
    name: kb_search
    function:
      type: lakebase_search
      retriever: *kb_ann

agents:
  kb_agent:
    name: kb_agent
    model: *default_llm
    tools:
      - *kb_search
    prompt: |
      You are a knowledge-base assistant. Use kb_search to look up relevant
      documents before answering. Cite the source URL from the metadata when
      possible.

app:
  name: dao-ai-lakebase-ann-example
  registered_model:
    name: dao_ai_lakebase_ann_example
  agents:
    - name: kb_agent
      model: *default_llm
      tools:
        - *kb_search
      prompt: |
        You are a knowledge-base assistant. Use kb_search to look up relevant
        documents before answering. Cite the source URL from the metadata when
        possible.
