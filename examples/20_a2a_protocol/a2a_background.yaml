# yaml-language-server: $schema=../../../schemas/model_config_schema.json
#
# Lakebase-backed A2A demo. ``a2a.task_store.database`` points at a
# Lakebase autoscaling project, persisting the A2A task lifecycle in the
# ``dao_ai_a2a_tasks`` table. Every ``message/send`` writes a row;
# ``tasks/get`` round-trips through the same row. State survives worker
# restarts and is shared across replicas.
#
# Pool sharing: the same DatabaseModel anchor is referenced from three
# places — A2A task store, LangGraph checkpointer, and the long-running
# Responses store — so AsyncPostgresPoolManager keeps a single pool open
# across all three.
#
# Auth: ambient. The Databricks Apps runtime gives the app's service
# principal access to the bound Lakebase project automatically. For OBO at
# the LLM layer, see the per-resource ``on_behalf_of_user: true`` on
# ``default_llm``.

resources:
  models:
    default_llm: &default_llm
      name: databricks-gpt-5-4-mini
      on_behalf_of_user: true

  databases:
    a2a_demo_db: &a2a_demo_db
      name: dao-ai-a2a-demo
      project: dao-ai-a2a-demo
      description: Lakebase project for A2A task persistence + LangGraph checkpointer.

tools:
  current_time: &current_time
    name: current_time
    function:
      type: python
      name: dao_ai.tools.current_time_tool
      human_in_the_loop:
        review_prompt: |
          Long-running A2A demo: approve / edit / reject the current_time call.
          The Task lifecycle (including this input-required state) is
          persisted in the Lakebase ``dao_ai_a2a_tasks`` table, so
          ``tasks/get`` works across worker restarts.
        allowed_decisions: [approve, edit, reject]

  say_hello: &say_hello
    name: say_hello
    function:
      type: python
      name: dao_ai.tools.say_hello_tool
      human_in_the_loop:
        review_prompt: |
          Long-running A2A demo: approve / edit / reject the say_hello call.
        allowed_decisions: [approve, edit, reject]

agents:
  hitl_obo_agent: &hitl_obo_agent
    name: hitl_obo_agent
    description: Demo agent showing live HITL + OBO + Lakebase-persisted A2A tasks.
    model: *default_llm
    tools:
      - *current_time
      - *say_hello
    prompt: |
      You are a demo agent. You have two tools (current_time and
      say_hello) — both are tagged for human-in-the-loop review. When
      the user asks for the time or asks you to say hello, ALWAYS call
      the tool (do not answer from memory). The system will pause and
      ask the caller to approve. Keep responses short.

memory: &memory
  # Postgres-backed checkpointer reuses the same Lakebase project as the
  # A2A task store — single connection pool via AsyncPostgresPoolManager.
  checkpointer:
    name: a2a_demo_checkpointer
    database: *a2a_demo_db

app:
  name: a2a-background
  description: dao-ai A2A demo with Lakebase-persisted Tasks + HITL + OBO.
  log_level: INFO
  deployment_target: apps
  agents:
    - *hitl_obo_agent
  orchestration:
    memory: *memory
  # Responses-API background store sharing the same DatabaseModel.
  background:
    database: *a2a_demo_db
  a2a:
    enabled: true
    # OBO auto-derived from default_llm.on_behalf_of_user above — the
    # Agent Card emits both oauth2 and bearer schemes. Pin
    # a2a.on_behalf_of_user explicitly to override.
    # Lakebase-backed A2A task store. The DatabaseModel anchor (*a2a_demo_db)
    # is the SAME object referenced by memory.checkpointer.database and
    # app.background.database above; AsyncPostgresPoolManager dedupes by
    # connection-string value, so all three share one pool.
    task_store:
      database: *a2a_demo_db
      table: dao_ai_a2a_tasks
