measures:
- name: messaging_adoption_rate_ty
  expr: CASE WHEN SUM(denominator_value_ty) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') = 0 THEN NULL ELSE SUM(numerator_value_ty)
    FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') / SUM(denominator_value_ty) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE')
    * 100 END
  display_name: Messaging Adoption
  comment: Current-year Messaging Adoption. Weighted rate from summed numerator and denominator.
  synonyms:
  - messaging adoption
  - TY messaging adoption
- name: messaging_adoption_rate_ly
  expr: CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') = 0 THEN NULL ELSE SUM(numerator_value_ly)
    FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') / SUM(denominator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE')
    * 100 END
  display_name: Messaging Adoption Prior Year
  comment: Prior-year comparable Messaging Adoption. Weighted rate from summed numerator and denominator.
  synonyms:
  - messaging adoption last year
  - LY messaging adoption
- name: messaging_adoption_rate_point_change
  expr: (CASE WHEN SUM(denominator_value_ty) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') = 0 THEN NULL ELSE SUM(numerator_value_ty)
    FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') / SUM(denominator_value_ty) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE')
    * 100 END) - (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') = 0 THEN NULL
    ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') / SUM(denominator_value_ly) FILTER
    (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') * 100 END)
  display_name: Messaging Adoption Point Change
  comment: Current minus prior-year Messaging Adoption, expressed in percentage points.
  synonyms:
  - messaging adoption point change
- name: messaging_adoption_rate_yoy_pct
  expr: CASE WHEN (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') = 0 THEN NULL
    ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') / SUM(denominator_value_ly) FILTER
    (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') * 100 END) IS NULL OR (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE
    metric_name = 'MESSAGING_ADOPTION_RATE') = 0 THEN NULL ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE')
    / SUM(denominator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') * 100 END) = 0 THEN NULL ELSE ((CASE
    WHEN SUM(denominator_value_ty) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') = 0 THEN NULL ELSE SUM(numerator_value_ty)
    FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') / SUM(denominator_value_ty) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE')
    * 100 END) - (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') = 0 THEN NULL
    ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') / SUM(denominator_value_ly) FILTER
    (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') * 100 END)) / ABS(CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name
    = 'MESSAGING_ADOPTION_RATE') = 0 THEN NULL ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE')
    / SUM(denominator_value_ly) FILTER (WHERE metric_name = 'MESSAGING_ADOPTION_RATE') * 100 END) * 100 END
  display_name: Messaging Adoption YoY %
  comment: Relative percent change in Messaging Adoption versus prior year.
  synonyms:
  - messaging adoption YoY
- name: systematic_refills_ty
  expr: CASE WHEN SUM(denominator_value_ty) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') = 0 THEN NULL ELSE
    SUM(numerator_value_ty) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') / SUM(denominator_value_ty) FILTER
    (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') * 100 END
  display_name: Systematic Refills %
  comment: Current-year Systematic Refills %. Weighted rate from summed numerator and denominator.
  synonyms:
  - systematic refills %
  - TY systematic refills %
- name: systematic_refills_ly
  expr: CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') = 0 THEN NULL ELSE
    SUM(numerator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') / SUM(denominator_value_ly) FILTER
    (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') * 100 END
  display_name: Systematic Refills % Prior Year
  comment: Prior-year comparable Systematic Refills %. Weighted rate from summed numerator and denominator.
  synonyms:
  - systematic refills % last year
  - LY systematic refills %
- name: systematic_refills_point_change
  expr: (CASE WHEN SUM(denominator_value_ty) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') = 0 THEN NULL ELSE
    SUM(numerator_value_ty) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') / SUM(denominator_value_ty) FILTER
    (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') * 100 END) - (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name
    = 'SYSTEMTIC_REFILL_PERCENTAGE') = 0 THEN NULL ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE')
    / SUM(denominator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') * 100 END)
  display_name: Systematic Refills % Point Change
  comment: Current minus prior-year Systematic Refills %, expressed in percentage points.
  synonyms:
  - systematic refills % point change
- name: systematic_refills_yoy_pct
  expr: CASE WHEN (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') = 0 THEN
    NULL ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') / SUM(denominator_value_ly)
    FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') * 100 END) IS NULL OR (CASE WHEN SUM(denominator_value_ly)
    FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') = 0 THEN NULL ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name
    = 'SYSTEMTIC_REFILL_PERCENTAGE') / SUM(denominator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE')
    * 100 END) = 0 THEN NULL ELSE ((CASE WHEN SUM(denominator_value_ty) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE')
    = 0 THEN NULL ELSE SUM(numerator_value_ty) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') / SUM(denominator_value_ty)
    FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') * 100 END) - (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE
    metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') = 0 THEN NULL ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE')
    / SUM(denominator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') * 100 END)) / ABS(CASE WHEN SUM(denominator_value_ly)
    FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE') = 0 THEN NULL ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name
    = 'SYSTEMTIC_REFILL_PERCENTAGE') / SUM(denominator_value_ly) FILTER (WHERE metric_name = 'SYSTEMTIC_REFILL_PERCENTAGE')
    * 100 END) * 100 END
  display_name: Systematic Refills % YoY %
  comment: Relative percent change in Systematic Refills % versus prior year.
  synonyms:
  - systematic refills % YoY
- name: dotcom_refills_ty
  expr: CASE WHEN SUM(denominator_value_ty) FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') = 0 THEN NULL ELSE SUM(numerator_value_ty)
    FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') / SUM(denominator_value_ty) FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE')
