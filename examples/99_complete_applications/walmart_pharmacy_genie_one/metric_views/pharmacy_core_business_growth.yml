comment: Core Pharmacy Business Growth metric view for AI and BI. Contains canonical row-based Pharmacy metrics. Finance/P&L
  metrics are explicitly restricted to FISCAL_CALENDAR and monthly fiscal reporting. Clinical outcome snapshots and Digital
  Population/account snapshots are modeled in separate metric views.
