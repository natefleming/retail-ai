- name: dotcom_refills_point_change
  expr: (CASE WHEN SUM(denominator_value_ty) FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') = 0 THEN NULL ELSE SUM(numerator_value_ty)
    FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') / SUM(denominator_value_ty) FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE')
    * 100 END) - (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') = 0 THEN NULL
    ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') / SUM(denominator_value_ly) FILTER
    (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') * 100 END)
  display_name: Dotcom Refills % Point Change
  comment: Current minus prior-year Dotcom Refills %, expressed in percentage points.
  synonyms:
  - dotcom refills % point change
- name: dotcom_refills_yoy_pct
  expr: CASE WHEN (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') = 0 THEN NULL
    ELSE SUM(numerator_value_ly) FILTER (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') / SUM(denominator_value_ly) FILTER
    (WHERE metric_name = 'DOTCOM_REFILL_PERCENTAGE') * 100 END) IS NULL OR (CASE WHEN SUM(denominator_value_ly) FILTER (WHERE
