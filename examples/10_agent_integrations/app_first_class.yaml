# yaml-language-server: $schema=../../../schemas/model_config_schema.json

# ==============================================================================
# First-class `type: app` example — call a Databricks App as a tool.
# ==============================================================================
# `type: app` is the Supervisor API `app` contract. Target is a Databricks
# App, which may host an agent (ResponsesAgent or otherwise) or any other
# HTTP service that speaks the OpenAI Responses or Chat Completions API.
#
# Wire shape (Responses vs Chat Completions) is selected by `api:`:
#   - api: responses
#   - api: completions
#   - api unset (default) → lazy probe of `<app_url>/agent/info` on first
#     invoke; falls back to "responses" if discovery returns no signal.
#
# Setting `api:` explicitly skips discovery entirely.
#
# For Model Serving endpoints (FMAPI / UC-registered agents), use
# `type: serving_endpoint` (see serving_endpoint_first_class.yaml).
# For external A2A agents (Vertex, Crew.ai, ADK), use `type: a2a`.
# For MCP apps (`mcp-` prefix), use `type: mcp`.
# ==============================================================================

resources:
  models:
    main_llm: &main_llm
      name: databricks-claude-sonnet-4
      temperature: 0.1

  apps:
    supplier_app: &supplier_app
      name: dao-ai-supplier-app
      on_behalf_of_user: true   # → forwarded_user_token at the supplier

tools:
  # 1. App with api unset → lazy /agent/info probe on first invoke;
  # falls back to "responses" default if discovery returns no signal.
  # Every dao-ai app emits agent_api: "responses" from /agent/info, so
  # the probe resolves to Responses without the user having to know.
  supplier_app_tool: &supplier_app_tool
    name: query_supplier
    function:
      type: app
      app: *supplier_app
      description: |
        Delegate supplier-domain questions to the deployed supplier agent.

  # 2. Same target with explicit api — no probe runs at all.
  # Useful when targeting a legacy app that only exposes Chat Completions.
  explicit_completions_tool: &explicit_completions_tool
    name: supplier_chat
    function:
      type: app
      app: *supplier_app
      api: completions
      description: |
        Same supplier app, forced to the Chat Completions wire shape.

agents:
  orchestrator: &orchestrator
    name: orchestrator
    model: *main_llm
    tools:
    - *supplier_app_tool
    - *explicit_completions_tool
    prompt: |
      You are an orchestrator delegating to a deployed supplier agent
      via the first-class `type: app` tool shape.

app:
  name: app_first_class_dao
  description: >
    Minimal example of the first-class `type: app` tool shape for
    calling a Databricks App as a tool.
  log_level: INFO
  deployment_target: apps
  agents:
  - *orchestrator

  input_example:
    messages:
    - role: user
      content: "What does the supplier offer?"
