# yaml-language-server: $schema=../../../schemas/model_config_schema.json


# =============================================================================
# PARAMETERS
# =============================================================================
parameters:
  catalog:
    description: Unity Catalog catalog name
    default: retail_consumer_goods
  schema:
    description: Schema within the catalog
    default: sporting_goods_store

# =============================================================================
# DEEP_AGENT PATTERN WITH SKILLS, INSTRUCTION FILES, AND PERMISSIONS
# =============================================================================
# Demonstrates the full deep_agent surface area after R1+R2 refinements:
#
#   - SkillModels declared on agents directly (R1) — translated to
#     SkillsMiddleware at config-load time
#   - Two named skill resources (one local, one volume-backed)
#   - app.agents declared once and implicitly used as sub-agents (R2)
#   - Extra sub-agents declared in dict form on deep_agent.subagents
#   - AGENTS.md instruction files loaded into the system prompt
#   - Filesystem permissions restricting where the agent can write
#   - HumanInTheLoopModel interrupt on the destructive write_file tool

schemas:
  retail_schema: &retail_schema
    catalog_name: ${var.catalog}
    schema_name: ${var.schema}

# =============================================================================
# RESOURCES
# =============================================================================
resources:
  models:
    default_llm: &default_llm
      name: databricks-claude-sonnet-4
      temperature: 0.1
      max_tokens: 4096

  volumes:
    skills_volume: &skills_volume
      schema: *retail_schema
      name: skills_library

  # Skills as first-class, reusable resources.
  skills:
    research: &research_skill
      name: research
      description: "Sporting goods research workflow with AGENTS.md memory."
      path: skills/sporting_goods_store/research

    governed_lookup: &governed_lookup_skill
      name: governed_lookup
      description: "Volume-backed product lookup skill (versioned in UC)."
      path:
        volume: *skills_volume
        path: product-lookup

# =============================================================================
# TOOLS
# =============================================================================
tools:
  current_time: &current_time
    name: current_time
    function:
      type: python
      name: dao_ai.tools.time.current_time_tool

# =============================================================================
# AGENTS
# =============================================================================
# R1: Skills attached directly to the agent. dao-ai translates each entry
# into a SkillsMiddleware via SkillModel.as_middleware() at config-load time —
# no need to hand-wire the create_skills_middleware factory into middleware.
agents:
  research_specialist: &research_specialist
    name: research_specialist
    description: "Sporting goods research specialist"
    model: *default_llm
    skills:
    - *research_skill
                                # R1: skill on agent → middleware
    prompt: |
      You investigate products thoroughly using the loaded research skill.
      For comparison questions, surface trade-offs honestly. Always cite
      sources from the catalog.

# =============================================================================
# APPLICATION
# =============================================================================
# R2: app.agents lists the agents available to the deep_agent as sub-agents.
# No placeholder "main_agent" — the deep_agent block IS the main planner.
app:
  name: deep_agent_skills
  description: "deep_agent with local + volume skills, dict-form subagents, HITL"
  log_level: INFO

  registered_model:
    schema: *retail_schema
    name: deep_agent_skills

  agents:
  - *research_specialist
                                # R2: implicit sub-agent (no need to re-list under subagents)

  orchestration:
    deep_agent:
      model: *default_llm

      system_prompt: |
        You are the planner for a sporting goods store. Delegate research
        questions to the research_specialist sub-agent. Use the math_helper
        for arithmetic on prices. Use write_todos for any task with more
        than two steps.

      tools:
      - *current_time

      # Top-level skills (passed natively to create_deep_agent(skills=...)).
      skills:
      - *governed_lookup_skill

      # AGENTS.md instruction files loaded into the system prompt at startup.
      # Both shapes are shown deliberately: the second lives inside a skill
      # directory, so skill staging already carries it, while the first is a
      # standalone file that every bundler has to stage on its own.
      instruction_files:
      - instructions/AGENTS.md
      - skills/sporting_goods_store/research/AGENTS.md

      # R2: Dict-form subagents for extras not already in app.agents.
      # The dict key becomes the sub-agent's name.
      subagents:
        math_helper:
          description: "Quick arithmetic helper"
          system_prompt: |
            You are a precise calculator. Show your work briefly before
            stating the final number.

      # Filesystem permissions — read everywhere, write only under /workspace.
      permissions:
      - paths: ["/workspace/**"]
        mode: allow
        operations: [read, write]
      - paths: ["/**"]
        mode: allow
        operations: [read]
      - paths: ["/**"]
        mode: deny
        operations: [write]

      # Human-in-the-loop on potentially destructive ops.
      interrupt_on:
        write_file: true

  input_example:
    messages:
    - role: user
      content: "Use your research skill to recommend a softball bat under $200 for a 12-year-old."
